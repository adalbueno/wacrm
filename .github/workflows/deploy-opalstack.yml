name: Deploy to Opalstack

# Applies any pending `supabase/migrations/*.sql` to production, then
# deploys the already-checked-out app on the Opalstack server by
# fetching latest `main`, rebuilding, and restarting the daemonized
# Next.js process (see the `start`/`stop` scripts Opalstack generates
# for a Node.js app resource).
#
# Migrations run first, deliberately — the freshly-built app may
# reference schema a new migration adds, so the schema has to exist
# before the restarted process starts serving requests against it. If
# the migration push fails, the job stops there (GitHub Actions' normal
# fail-fast-between-steps behavior) and the SSH deploy step below never
# runs — never a good idea to roll out code against a schema that
# didn't actually update.
#
# Gated on the CI workflow's own conclusion (via workflow_run) rather
# than re-running lint/typecheck/test/build here — avoids duplicating
# that whole job and guarantees we never deploy something CI hasn't
# already passed, even if branch protection is ever loosened.
#
# `workflow_dispatch` is also wired up: workflow_run only fires for the
# version of this file that's on the default branch, so it's the only
# way to test a change to this workflow itself before merging it.
on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:

# Never cancel a deploy mid-flight — that could leave the server with a
# half-updated checkout or a killed-but-not-restarted process. A second
# push while one is running waits instead.
concurrency:
  group: deploy-opalstack
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Opalstack
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run doesn't default to the commit that triggered
          # it — pin explicitly, so a migration file added in the same
          # push CI just verified is the one that gets pushed below.
          # workflow_dispatch has no workflow_run event, so fall back
          # to the dispatched ref's own sha.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: supabase/setup-cli@v1
        with:
          # Pinned to match .github/workflows/migrations.yml — a CLI
          # release changing push behaviour should be a deliberate bump
          # in a PR, not a surprise on the next deploy.
          version: 2.113.0

      - name: Apply pending migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref iqitekmnkgokzgztxnzt
          supabase db push

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.OPALSTACK_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy over SSH
        env:
          OPALSTACK_HOST: opal18.opalstack.com
          OPALSTACK_USER: adaliso
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=10 \
              "$OPALSTACK_USER@$OPALSTACK_HOST" 'bash -s' <<'REMOTE'
            # No -u: Opalstack's generated `activate` (sourced below)
            # reads its own tracking vars (e.g. APPNAME_ORIGINAL_PATH)
            # without a default, which nounset treats as a hard error
            # on the very first source in a fresh session.
            set -eo pipefail

            APPDIR="$HOME/apps/tramparnagringa-crm-whatsapp"
            PROJECTDIR="$APPDIR/wacrm"

            cd "$PROJECTDIR"
            git fetch origin main
            git reset --hard origin/main

            # Puts this app's own Node version (env/bin) on PATH — see
            # $APPDIR/activate, generated by Opalstack for this app
            # resource. Must be sourced, not executed.
            source "$APPDIR/activate"

            npm ci
            npm run build

            cd "$APPDIR"
            ./stop || true
            ./start

            # Give the daemonized process a moment to come up, then
            # fail the deploy loudly if it didn't — a deploy that
            # "succeeds" into a crashed process is worse than one that
            # fails outright, and `resurrect`'s own cron cadence is too
            # slow to be this pipeline's success signal.
            sleep 8
            curl -sf --connect-timeout 5 --max-time 10 http://127.0.0.1:1197/ -o /dev/null
          REMOTE
